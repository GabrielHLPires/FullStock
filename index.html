<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FullStock – Gestão de Estoque</title>
</head>
<body>

  <header>
    <h1>FullStock</h1>
    <p>Sistema Integrado de Gestão de Materiais para Obras</p>
    <nav aria-label="Navegação principal">
      <ul>
        <li><a href="#cadastro">Cadastrar material</a></li>
        <li><a href="#estoque">Estoque</a></li>
        <li><a href="#detalhes">Detalhes</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="cadastro">
      <h2>Cadastrar material</h2>
      <p>Preencha os dados do material de construção. Campos com * são obrigatórios.</p>

      <form action="#" method="post">
        <fieldset>
          <legend>Identificação</legend>

          <p>
            <label for="codigo">Código (ID)</label>
            <input type="text" id="codigo" name="codigo" value="Gerado automaticamente" readonly>
          </p>

          <p>
            <label for="nome">Nome do material *</label>
            <input type="text" id="nome" name="nome" placeholder="Ex.: Cimento CP II 50 kg" required>
          </p>

          <p>
            <label for="categoria">Categoria *</label>
            <select id="categoria" name="categoria" required>
              <option value="">Selecione...</option>
              <option value="areia">Areia</option>
              <option value="brita">Brita</option>
              <option value="cimento">Cimento</option>
              <option value="tijolo">Tijolo</option>
              <option value="outros">Outros</option>
            </select>
          </p>

          <p>
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="3" placeholder="Especificações do material"></textarea>
          </p>
        </fieldset>

        <fieldset>
          <legend>Medidas e preços</legend>

          <p>
            <label for="unidade">Unidade de medida *</label>
            <select id="unidade" name="unidade" required>
              <option value="">Selecione...</option>
              <option value="kg">Kg</option>
              <option value="metro">Metro</option>
              <option value="litro">Litro</option>
              <option value="unidade">Unidade</option>
            </select>
          </p>

          <p>
            <label for="preco-custo">Preço de custo (R$) *</label>
            <input type="number" id="preco-custo" name="preco-custo" min="0" step="0.01" required>
          </p>

          <p>
            <label for="preco-venda">Preço de venda (R$) *</label>
            <input type="number" id="preco-venda" name="preco-venda" min="0" step="0.01" required>
          </p>
        </fieldset>

        <fieldset>
          <legend>Estoque e rastreio</legend>

          <p>
            <label for="quantidade">Quantidade em estoque *</label>
            <input type="number" id="quantidade" name="quantidade" min="0" required>
          </p>

          <p>
            <label for="estoque-minimo">Estoque mínimo *</label>
            <input type="number" id="estoque-minimo" name="estoque-minimo" min="0" required>
          </p>

          <p>
            <label for="validade">Data de validade (opcional)</label>
            <input type="date" id="validade" name="validade">
          </p>

          <p>
            <label for="lote">Lote</label>
            <input type="text" id="lote" name="lote" placeholder="Ex.: L2026-014">
          </p>

          <p>
            <label for="fornecedor">Fornecedor *</label>
            <select id="fornecedor" name="fornecedor" required>
              <option value="">Selecione...</option>
              <option value="101">101 – Pedreira Central</option>
              <option value="102">102 – Cimentos Minas</option>
              <option value="103">103 – Cerâmica Horizonte</option>
            </select>
          </p>
        </fieldset>

        <p>
          <button type="submit">Salvar material</button>
          <button type="reset">Limpar</button>
        </p>
      </form>
    </section>
  </main>

  <footer>
    <p>FullStock – PUC Minas, 2026.2</p>
  </footer>

</body>
</html>
